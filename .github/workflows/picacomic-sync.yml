name: Sync Picacomic APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/picacomic-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Picacomic APK
        run: |
          mkdir -p yomu-picacomic/apk
          curl -L --fail --retry 3 \
            -o yomu-picacomic/apk/tachiyomi-zh.picacomic-v1.4.8.apk \
            'https://github.com/keiyoushi/extensions/releases/download/a76c957-2/tachiyomi-zh.picacomic-v1.4.8.apk'
          ls -lh yomu-picacomic/apk/tachiyomi-zh.picacomic-v1.4.8.apk
      - name: Commit APK
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add yomu-picacomic/apk/tachiyomi-zh.picacomic-v1.4.8.apk
          git diff --cached --quiet && exit 0
          git commit -m 'Add Picacomic APK for Yomu test'
          git push
