name: Douyu smoke test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'douyu.mjs'
      - '.github/workflows/douyu-smoke.yml'

jobs:
  douyu-6657:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect Douyu 6657 options
        run: |
          sed -i "/const streamUrl = buildStreamUrl(playData);/a\\  console.log('Multirates:', JSON.stringify(playData.multirates || [])); console.log('CDNs:', JSON.stringify(playData.cdnsWithName || []));" douyu.mjs
          node douyu.mjs 6657 --no-url
