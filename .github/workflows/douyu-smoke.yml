name: Douyu smoke test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'douyu.mjs'
      - '.github/workflows/douyu-smoke.yml'

jobs:
  douyu-6657:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate line 1 ws-h5
        run: node douyu.mjs 6657 --check
      - name: Generate line 7 hw-h5
        run: |
          sed -i "s/body.set('cdn', '');/body.set('cdn', 'hw-h5');/" douyu.mjs
          node douyu.mjs 6657 --check
